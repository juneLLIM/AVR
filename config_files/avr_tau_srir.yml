# AVR baseline on TAU-SRIR `bomb_shelter` (24 kHz, 0.1 s = seq_len 2400).
# Mirrors the acousticGS project setup so metrics are directly comparable.
# - Held-out test: middle height index (4 of 9), 720 test rx, 5760 train rx.
# - FOA W-channel only; mic centre treated as transmitter under reciprocity.

### Path settings
path:
  expname: TAU_SRIR
  dataset_type: TAU-SRIR
  logdir: logs/TAU-SRIR/

### rendering settings
# bomb_shelter source bbox is roughly (+/-5 m, z in [0.4, 2.0]); use a generous
# cube to bracket. xyz_max = 6 mirrors the MeshRIR config bound style.
render:
  xyz_min: -6
  xyz_max:  6
  near: 0
  far: 6
  n_samples: 80
  n_azi: 80
  n_ele: 40
  speed: 343.8
  fs: 24000
  pathloss: 1.5

### training settings
train:
  lr: 5e-4
  weight_decay: 0
  T_max: 500000
  eta_min: 5e-5
  total_iterations: 500000
  load_ckpt: Flase
  save_freq: 20000
  # val_freq > total_iterations disables in-training validation. Pure training
  # time is measured. eval_all_ckpts.py runs on saved ckpts post-hoc for the
  # convergence curve. Mirror this on the acousticGS side (test_freq large).
  val_freq: 1000000

  spec_loss_weight: 2
  amplitude_loss_weight: 4
  angle_loss_weight: 1
  time_loss_weight: 50
  energy_loss_weight: 1
  multistft_loss_weight: 1

### model settings
model:
  signal_output_dim: 2400
  leaky_relu: 0.03

  pos_encoding_sigma:
    base_resolution: 16
    log2_hashmap_size: 18
    n_features_per_level: 2
    n_levels: 20
    otype: HashGrid

  dir_encoding_sig:
    base_resolution: 16
    log2_hashmap_size: 20
    n_features_per_level: 2
    n_levels: 20
    otype: HashGrid

  tx_encoding_sig:
    base_resolution: 16
    log2_hashmap_size: 18
    n_features_per_level: 2
    n_levels: 20
    otype: HashGrid

  sigma_encoder_network:
    activation: ReLU
    n_hidden_layers: 3
    n_neurons: 128
    otype: FullyFusedMLP
    output_activation: None

  sigma_decoder_network:
    activation: ReLU
    n_hidden_layers: 3
    n_neurons: 128
    otype: FullyFusedMLP
    output_activation: None

  signal_network:
    activation: ReLU
    n_hidden_layers: 3
    n_neurons: 512
    otype: CutlassMLP
    output_activation: None
